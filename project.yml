name: PostcardFilm
options:
  bundleIdPrefix: com.postcardfilm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultSourceDirectoryType: group
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PostcardFilm:
    type: application
    platform: iOS
    sources:
      - path: PostcardFilm
        type: group
        excludes:
          - "**/Info.plist"
          - "Resources/**"
      - path: PostcardFilm/Resources/Assets.xcassets
        buildPhase: resources
        type: file
      - path: PostcardFilm/Resources/Fonts/Caveat-Regular.ttf
        buildPhase: resources
        type: file
      - path: PostcardFilm/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postcardfilm.app
        PRODUCT_NAME: PostcardFilm
        INFOPLIST_FILE: PostcardFilm/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: NS3BMJWSNV
        CODE_SIGN_STYLE: Automatic
  PostcardFilmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PostcardFilmTests
    dependencies:
      - target: PostcardFilm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.postcardfilm.app.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PostcardFilm.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PostcardFilm"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PostcardFilm:
    build:
      targets:
        PostcardFilm: all
        PostcardFilmTests: [test]
    run:
      config: Debug
      executable: PostcardFilm
    test:
      config: Debug
      targets:
        - PostcardFilmTests
    profile:
      config: Release
      executable: PostcardFilm
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
      isShown: true
      orderHint: 0
  PostcardFilmTests:
    build:
      targets:
        PostcardFilmTests: [test]
        PostcardFilm: [testing]
    test:
      config: Debug
      targets:
        - PostcardFilmTests
    management:
      shared: true
      isShown: true
      orderHint: 1
